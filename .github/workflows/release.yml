# Publishes to the VS Code Marketplace and Open VSX when you push a tag like v0.2.0.
# Marketplace: signs in to Microsoft Entra ID as a user-assigned managed identity through GitHub OIDC,
#   so no Marketplace token is stored (Azure DevOps retires global PATs on 2026-12-01).
#   Secrets of the "marketplace-publish" environment: AZURE_CLIENT_ID, AZURE_TENANT_ID.
# Open VSX: repository secret OVSX_PAT (open-vsx.org token).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: xvfb-run -a npm test
      - run: npx vsce package --no-dependencies -o extension.vsix
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: npx vsce publish --no-dependencies --packagePath extension.vsix --azure-credential
      # Creates the namespace on the first release; afterwards it already exists.
      - run: npx ovsx create-namespace "$(node -p "require('./package.json').publisher")" || true
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
      - run: npx ovsx publish extension.vsix
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
