# Publishes to the VS Code Marketplace and Open VSX when you push a tag like v0.2.0.
# Repository secrets needed: VSCE_PAT (Azure DevOps token, Marketplace > Manage) and OVSX_PAT (open-vsx.org token).
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: xvfb-run -a npm test
      - run: npx vsce package --no-dependencies -o extension.vsix
      - run: npx vsce publish --no-dependencies --packagePath extension.vsix
        env: { VSCE_PAT: "${{ secrets.VSCE_PAT }}" }
      - run: npx ovsx publish extension.vsix
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
