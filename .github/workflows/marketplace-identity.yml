# One-time setup helper (Actions tab > Marketplace identity > Run workflow).
# Prints the Azure DevOps profile id of the managed identity that release.yml signs in as.
# Add that id as a Contributor member of the Marketplace publisher.
name: Marketplace identity
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: |
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "Marketplace member id: $id"
          echo "Add \`$id\` as a **Contributor** at https://marketplace.visualstudio.com/manage (publisher > Members)." >> "$GITHUB_STEP_SUMMARY"
